<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abiotic Editor</title>
    <!-- Local `dotnet run` serves this app at site root. The GitHub Pages workflow
         (.github/workflows/docs.yml) rewrites this to /AbioticEditor/app/ in the
         published output, since Pages serves it from that subpath. -->
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- The same look as the desktop app, from the same files: the shared screens and their
         stylesheet, fonts and images all live in AbioticEditor.Web.Shared, published under
         _content/. The scoped-CSS bundle is named after THIS app - the SDK folds a referenced
         library's per-component styles into the consuming app's single bundle. -->
    <link rel="stylesheet" href="AbioticEditor.Web.Wasm.styles.css" />
    <link rel="stylesheet" href="_content/AbioticEditor.Web.Shared/parity.css" />
    <link rel="icon" type="image/png" href="_content/AbioticEditor.Web.Shared/images/abiotic-factor.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/AbioticEditor.Web.Shared/modal.js"></script>
    <script src="js/downloadFile.js"></script>
    <script src="js/filePicker.js"></script>
    <script src="js/saveFileSystem.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
