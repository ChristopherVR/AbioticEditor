name: Bug report
description: Something in the editor is broken, crashing, or not saving correctly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem! The single most useful thing you can attach is the
        editor's **diagnostic log** - most fixes start there. Here's how to grab it:

        1. Open the app, go to **Settings ▸ Diagnostics**, and turn on **Diagnostic logging**
           (it's off by default, so nothing is recorded until you flip this on).
        2. Reproduce the problem: reload the save, make the edit, whatever triggered it.
        3. Back in **Settings ▸ Diagnostics**, click **OPEN LOG FOLDER**. This opens
           `%LOCALAPPDATA%\AbioticEditor\logs` in your file manager - the newest
           `editor-YYYYMMDD.log` is today's.
        4. Drag that file into the log field below (GitHub uploads it and adds a link).

        Crashes and save-write failures are logged even if you forgot to turn diagnostics on
        beforehand, so it's worth checking the folder either way.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: e.g. I added a trait, pressed SAVE, reloaded the save, and the trait wasn't there.
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: The exact clicks/commands that trigger it, if you can narrow it down.
      placeholder: |
        1. Load save X
        2. Open the Character tab
        3. Add trait "..."
        4. Press SAVE, reload
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Editor version
      description: Shown in the app title bar, or Settings ▸ Updates. For the CLI, `abioticeditor version`.
      placeholder: e.g. v1.20.4
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows (desktop app)
        - macOS (desktop app)
        - Windows (CLI)
        - Linux (CLI)
        - macOS (CLI)
    validations:
      required: true
  - type: dropdown
    id: save-source
    attributes:
      label: Where's the save from?
      options:
        - Steam
        - Game Pass / Microsoft Store
        - Dedicated server
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic log
      description: Drag the `editor-YYYYMMDD.log` file here, or paste its contents. See the steps above for how to find it.
      render: shell
    validations:
      required: false
  - type: textarea
    id: save-file
    attributes:
      label: Save file (optional)
      description: If you can share the affected save (or a copy with anything sensitive stripped), it's the fastest way to reproduce and fix the problem. Drag it in below.
    validations:
      required: false
