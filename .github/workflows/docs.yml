name: Docs

# Build the VitePress documentation site (docs/) AND the browser-only Blazor WebAssembly
# editor (src/AbioticEditor.Web.Wasm), then deploy both together to GitHub Pages as one
# site: the docs at the root (https://christophervr.github.io/AbioticEditor/) and the
# editor at /app/ (https://christophervr.github.io/AbioticEditor/app/). GitHub Pages
# serves exactly one artifact per deployment, so both halves have to be assembled into a
# single directory before the upload step, not deployed from separate workflow runs -
# a second independent deploy would silently replace the other one.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - src/AbioticEditor.Web.Wasm/**
      - src/AbioticEditor.Core/**
      - src/AbioticEditor.Ui.Abstractions/**
      - src/AbioticEditor.Plugins.Abstractions/**
      - submodules/**
      - Directory.Packages.props
      - Directory.Build.props
      - .github/workflows/docs.yml
  workflow_dispatch:

# Allow only one concurrent deployment. Do NOT cancel an in-progress Pages
# deployment, so a running production deploy is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The browser editor build needs Core, which needs both submodules.
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs

      - name: Build docs site
        run: npm run docs:build
        working-directory: docs

      - name: Publish browser editor
        run: dotnet publish src/AbioticEditor.Web.Wasm -c Release -o publish/app

      # The published index.html is built for local `dotnet run` at site root ("/"), but
      # this app is served from the /app/ subpath under the docs site's own base path.
      # Blazor WASM has no MSBuild "base href" knob, so the published output is patched
      # in place; this is the standard recipe for hosting a standalone Blazor WASM app
      # under a subpath on static hosting.
      - name: Rewrite base href for the /app/ subpath
        run: sed -i 's#<base href="/" />#<base href="/AbioticEditor/app/" />#' publish/app/wwwroot/index.html

      - name: Assemble combined site
        run: |
          mkdir -p docs/.vitepress/dist/app
          cp -r publish/app/wwwroot/. docs/.vitepress/dist/app/
          # GitHub Pages' legacy Jekyll processing ignores "_"-prefixed paths like
          # _framework/, which is where Blazor WASM ships the actual runtime and app
          # assemblies; without this the editor loads an empty shell with no app inside.
          touch docs/.vitepress/dist/.nojekyll

      # The editor's routes (/app/stats, /app/skills, ...) exist only in its client-side
      # router, so refreshing one - or following a link straight to it - asks Pages for a file
      # that was never published. Pages answers any such request with the SITE-ROOT 404.html,
      # which VitePress owns, so the fix belongs there rather than in a nested 404 the server
      # would never reach. Injecting a redirect (instead of replacing the file) keeps the docs'
      # own not-found page intact for docs URLs. Sending these to the editor's entry point
      # rather than restoring the deep route is deliberate and costs nothing: the open save
      # lives in memory only, so a reloaded deep link has no save to show either way.
      - name: Route editor deep links back to the editor
        run: |
          sed -i 's#<head>#<head><script>(function(){var a="/AbioticEditor/app/";if(location.pathname.indexOf(a)===0\&\&location.pathname!==a){location.replace(a);}})();</script>#' \
            docs/.vitepress/dist/404.html
          grep -q 'AbioticEditor/app/' docs/.vitepress/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
